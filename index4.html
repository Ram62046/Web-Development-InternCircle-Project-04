
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Live Weather Dashboard</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style4.css">

    <!-- Connect JavaScript -->
    <script src="script4.js" defer></script>
</head>

<body>

    <main class="weather-container">

        <!-- Header -->
        <header class="header">
            <h1>🌤 Weather Dashboard</h1>
            <p>Check live weather conditions around the world</p>
        </header>


        <!-- Search Section -->
        <section class="search-section">

            <form id="search-form">

                <input
                    type="text"
                    id="city-input"
                    placeholder="Enter city name..."
                    autocomplete="off"
                    required
                >

                <button type="submit" id="search-btn">
                    Search
                </button>

            </form>

        </section>


        <!-- Loading Message -->
        <p id="loading" class="message" role="status" hidden>
            Loading weather data...
        </p>


        <!-- Error Message -->
        <p id="error-message"
           class="error-message"
           role="alert"
           hidden>
        </p>


        <!-- Current Weather -->
        <section id="current-weather" class="current-weather" hidden>

            <div class="location">
                <h2 id="city-name">City Name</h2>
                <p id="current-date"></p>
            </div>

            <div class="weather-main">

                <div class="weather-icon" id="weather-icon">
                    ☀️
                </div>

                <div>
                    <h3 id="temperature">--°C</h3>
                    <p id="weather-description">Weather condition</p>
                </div>

            </div>


            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail-card">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail-card">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="wind-speed">-- km/h</h3>
                </div>

                <div class="detail-card">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <h3 id="feels-like">--°C</h3>
                </div>

            </div>

        </section>


        <!-- Five Day Forecast -->
        <section id="forecast-section" hidden>

            <h2 class="forecast-heading">
                5-Day Weather Forecast
            </h2>

            <div id="forecast-container"
                 class="forecast-container">
            </div>

        </section>


        <!-- Footer -->
        <footer>
            <p>Weather Dashboard | Powered by Open-Meteo</p>
        </footer>

    </main>

</body>
</html>
